name: Preview

# Each pull request gets its own preview at <site>/pr-preview/pr-<number>/,
# linked in a comment on the PR. Closing or merging the PR removes it.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        if: github.event.action != 'closed'
        run: python3 scripts/check_site.py site
      - name: Keep previews out of search
        if: github.event.action != 'closed'
        run: find site -name '*.html' -exec sed -i 's|<head>|<head>\n<meta name="robots" content="noindex, nofollow">|' {} +
      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
