name: Deploy site

# Every push to main publishes site/ to the gh-pages branch, which
# GitHub Pages serves. Pull-request previews live under pr-preview/ on
# the same branch, so the deploy leaves that folder alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        run: python3 scripts/check_site.py site
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
